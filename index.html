<title>Finance Expense Control Tower</title>

<style>
:root{--bg:#0c0e18;--card:#131620;--border:#1e2233;--text:#e2e4e9;--muted:#6b7280;--green:#10b981;--red:#ef4444;--amber:#f59e0b;--blue:#3b82f6;--purple:#8b5cf6;--teal:#14b8a6}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif;min-height:100vh;font-size:13px}
.header{background:var(--card);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;flex-wrap:wrap;gap:10px;position:sticky;top:0;z-index:100}
.header h1{font-size:17px;font-weight:700;color:#fff}
.badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:10px;font-weight:600}
.badge-live{background:rgba(16,185,129,.15);color:var(--green)}
.app-layout{display:flex;min-height:calc(100vh - 52px)}
.sidebar{width:200px;min-width:200px;background:var(--card);border-right:1px solid var(--border);padding:12px 0;position:sticky;top:52px;height:calc(100vh - 52px);overflow-y:auto}
.sidebar .nav{display:flex;flex-direction:column;gap:1px;padding:0 8px}
.sidebar .nav button{border:none;background:transparent;color:var(--muted);padding:8px 14px;border-radius:6px;cursor:pointer;font-size:11px;font-weight:500;text-align:left;font-family:inherit;width:100%}
.sidebar .nav button.active{background:var(--border);color:#fff}
.sidebar .nav button:hover{color:#fff;background:rgba(255,255,255,0.03)}
.nav-group{margin-bottom:4px}
.nav-group-header{cursor:pointer;padding:8px 14px;font-size:11px;font-weight:600;color:var(--text);border-radius:6px;user-select:none;display:flex;align-items:center;gap:6px;margin:0 8px 2px}
.nav-group-header:hover{background:rgba(255,255,255,0.04)}
.nav-group-toggle{font-size:9px;transition:transform 0.2s;display:inline-block}
.nav-group-toggle.collapsed{transform:rotate(-90deg)}
.nav-group-items.collapsed{display:none}
.main-content{flex:1;overflow-y:auto;padding:0}
.page{display:none;padding:16px 20px}
.page.active{display:block}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:12px 14px}
.kpi:hover{border-color:var(--blue)}
.kpi .kpi-val{font-size:20px;font-weight:700;font-family:'SF Mono',Consolas,monospace}
.kpi .kpi-lbl{font-size:10px;color:var(--muted);margin-top:2px;text-transform:uppercase;letter-spacing:.3px}
.kpi .kpi-sub{font-size:10px;margin-top:1px}
.chart-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(400px,1fr));gap:14px;margin-bottom:14px}
.chart-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px}
.chart-card h3{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px;font-weight:600}
.chart-card canvas{max-height:300px}
.chart-card.full-width{grid-column:1/-1}
table{width:100%;border-collapse:collapse;font-size:11px}
th{text-align:left;padding:7px 10px;border-bottom:1px solid var(--border);color:var(--muted);font-size:10px;text-transform:uppercase;font-weight:600;white-space:nowrap}
td{padding:6px 10px;border-bottom:1px solid var(--border);color:#aaa}
tr:hover td{color:#fff}
.mono{font-family:'SF Mono',Consolas,monospace}
.green{color:var(--green)}.red{color:var(--red)}.amber{color:var(--amber)}.blue{color:var(--blue)}.purple{color:var(--purple)}.teal{color:var(--teal)}
.overflow{overflow-x:auto}
h2.page-title{font-size:16px;margin-bottom:16px;color:#fff}.table-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:14px;margin-bottom:14px}
.table-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px}
.table-card h3{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;font-weight:600}
.bar-mini{display:inline-block;height:6px;border-radius:3px;vertical-align:middle;margin-right:6px}
</style>
</head>
